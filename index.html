<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>Usergram - sua rede social</title>
</head>

<body>

    <!-- AREA WRAPPER -->
    <div id="wrapper">

        <!-- AREA CONTAINER-->
        <div id="container">

            <!-- AREA ESQUERDA-->
            <div class="column left">
                <div class="main"></div>
            </div>
            <!-- FIM AREA ESQUERDA-->


            <!-- AREA DIREITA-->
            <div class="column right">
                <div class="login-panel">

                    <div class="logo">
                        <img class="logo-img" src="assets/logo.png" alt="Logo do sujeitogramador">
                    </div>


                    <form action="">
                        <input placeholder="Telefone, usuário ou e-mail" type="text" name="username">
                        <input placeholder="Senha" type="password" name="password">

            

                        <input type="submit" value="Entrar">                         
                </div>


                <div class="info-box">
                    <p>Não possui uma conta? <a href="signup.html">Cadastre-se</a> </p>
                </div>

                <div class="get-app-panel">
                    Obtenha o aplicativo.
                    <div class="app-buttons">
                        <a href="#">
                        <img src="assets/appstore.png" alt="Baixe na Appstore">
                    </a>
                    <a href="#">
                        <img src="assets/googleplay.png" alt="Baixe na Googleplay">
                    </a>

                    </div>
                </div>

            </div>
            <!-- FIM AREA DIREITA-->
        </div>
        <!-- FIM AREA CONTAINER-->

        <footer>
            <div class="footer-inner">
                <a href="#">ABOUT US</a>
                <a href="#">SUPPORT</a>
                <a href="#">BLOG</a>
                <a href="#">PRESS</a>
                <a href="#">API</a>
                <a href="#">JOBS</a>
                <a href="#">PRIVACY</a>
                <a href="#">TERMS</a>
                <a href="#">DIRECTORY</a>
                <a href="#">PROFILES</a>
                <a href="#">HASHTAGS</a>
                <a href="#">LANGUAGE</a>

                <div class="text-small">@ 2022 Instagram</div>

            </div>

        </footer>



    </div>
    <!-- FIM AREA WRAPPER-->
    








</body>

</html>
